<div class="admin">
  <aside class="lateral">
    <a routerLink="/admin" class="marca">
      LojaCosméticos
      <small>administração</small>
    </a>

    <nav aria-label="Menu do painel administrativo">
      @for (i of itens; track i.rota) {
        <a [routerLink]="'/admin/' + i.rota" routerLinkActive="ativo"
           [routerLinkActiveOptions]="{ exact: i.rota === '' }">{{ i.rotulo }}</a>
      }
    </nav>

    <a routerLink="/loja" class="voltar">← Ir para a loja</a>
  <button type="button" class="voltar" (click)="sair()">Sair ({{ sessao.cliente()?.nome }})</button>
  </aside>

  <main class="principal"><router-outlet /></main>
</div>
<app-mensagem />
